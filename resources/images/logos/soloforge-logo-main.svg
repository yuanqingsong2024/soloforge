<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4"/>
      <stop offset="50%" style="stop-color:#34A853"/>
      <stop offset="100%" style="stop-color:#FBBC05"/>
    </linearGradient>
    <linearGradient id="forgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="flameGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="50%" style="stop-color:#F7931E"/>
      <stop offset="100%" style="stop-color:#FBBC05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 主背景 -->
  <rect width="256" height="256" rx="48" fill="url(#bgGradient)"/>
  
  <!-- 内圆装饰 -->
  <circle cx="128" cy="128" r="96" fill="url(#forgeGradient)" opacity="0.95"/>
  
  <!-- 火焰/锤子核心符号 -->
  <g filter="url(#glow)">
    <!-- 火焰造型，代表"锻造" -->
    <path d="M128 50 
             C145 80 170 95 170 125
             C170 150 150 165 135 175
             L128 185
             L121 175
             C106 165 86 150 86 125
             C86 95 111 80 128 50Z" 
          fill="url(#flameGradient)"/>
    
    <!-- 锤子图标简化造型 -->
    <rect x="108" y="95" width="40" height="12" rx="3" fill="#1a1a2e"/>
    <rect x="118" y="107" width="20" height="30" rx="2" fill="#1a1a2e"/>
    
    <!-- 高光 -->
    <ellipse cx="125" cy="85" rx="15" ry="8" fill="white" opacity="0.3"/>
  </g>
  
  <!-- SF 字母组合 -->
  <text x="128" y="235" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="700" 
        fill="white" 
        text-anchor="middle"
        letter-spacing="8">SF</text>
</svg>
