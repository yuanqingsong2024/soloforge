<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34A853"/>
      <stop offset="100%" style="stop-color:#81C995"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34A853"/>
      <stop offset="100%" style="stop-color:#4285F4"/>
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="200" cy="120" r="70" fill="url(#successGrad)" opacity="0.1"/>
  
  <!-- 圆形背景 -->
  <circle cx="200" cy="120" r="55" fill="url(#checkGrad)" opacity="0.15"/>
  
  <!-- 勾选图标 -->
  <g transform="translate(165, 85)">
    <circle cx="35" cy="35" r="35" fill="url(#checkGrad)"/>
    <path d="M18 35 L30 47 L55 22" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- 庆祝粒子 -->
  <circle cx="130" cy="90" r="4" fill="#FBBC05" opacity="0.8"/>
  <circle cx="270" cy="85" r="3" fill="#4285F4" opacity="0.7"/>
  <circle cx="145" cy="160" r="3" fill="#34A853" opacity="0.6"/>
  <circle cx="255" cy="155" r="4" fill="#EA4335" opacity="0.5"/>
  <circle cx="180" cy="70" r="2" fill="#FBBC05" opacity="0.7"/>
  <circle cx="220" cy="175" r="3" fill="#4285F4" opacity="0.6"/>
  
  <!-- 文字 -->
  <text x="200" y="230" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#475569" text-anchor="middle">操作成功</text>
  <text x="200" y="255" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">任务已完成</text>
</svg>
