<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="errorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EA4335"/>
      <stop offset="100%" style="stop-color:#FF6B6B"/>
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="200" cy="120" r="60" fill="url(#errorGrad)" opacity="0.1"/>
  
  <!-- 警告图标 -->
  <g transform="translate(160, 70)">
    <!-- 三角形背景 -->
    <path d="M40 0 L80 65 L0 65 Z" fill="url(#errorGrad)" opacity="0.2"/>
    
    <!-- 三角形边框 -->
    <path d="M40 8 L74 60 L6 60 Z" fill="none" stroke="url(#errorGrad)" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- 感叹号 -->
    <rect x="36" y="22" width="8" height="22" rx="2" fill="url(#errorGrad)"/>
    <circle cx="40" cy="52" r="3" fill="url(#errorGrad)"/>
  </g>
  
  <!-- 装饰线条 -->
  <line x1="120" y1="100" x2="150" y2="100" stroke="#EA4335" stroke-width="2" opacity="0.3"/>
  <line x1="250" y1="110" x2="280" y2="110" stroke="#EA4335" stroke-width="2" opacity="0.3"/>
  <line x1="130" y1="150" x2="155" y2="150" stroke="#EA4335" stroke-width="2" opacity="0.2"/>
  <line x1="245" y1="145" x2="270" y2="145" stroke="#EA4335" stroke-width="2" opacity="0.2"/>
  
  <!-- 文字 -->
  <text x="200" y="220" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#475569" text-anchor="middle">出错了</text>
  <text x="200" y="245" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">请稍后重试或联系管理员</text>
</svg>
