<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="maintainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBC05"/>
      <stop offset="100%" style="stop-color:#F7931E"/>
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="200" cy="130" r="80" fill="url(#maintainGrad)" opacity="0.08"/>
  
  <!-- 扳手图标 -->
  <g transform="translate(160, 70)">
    <!-- 扳手头 -->
    <circle cx="40" cy="40" r="30" fill="none" stroke="url(#maintainGrad)" stroke-width="8"/>
    <circle cx="40" cy="40" r="18" fill="url(#maintainGrad)" opacity="0.3"/>
    
    <!-- 扳手柄 -->
    <rect x="32" y="65" width="16" height="50" rx="4" fill="url(#maintainGrad)" transform="rotate(-45 40 90)"/>
    
    <!-- 齿轮装饰 -->
    <circle cx="70" cy="70" r="15" fill="url(#maintainGrad)" opacity="0.4"/>
    <circle cx="15" cy="25" r="10" fill="url(#maintainGrad)" opacity="0.3"/>
  </g>
  
  <!-- 时钟装饰 -->
  <g transform="translate(260, 90)">
    <circle cx="25" cy="25" r="22" fill="none" stroke="url(#maintainGrad)" stroke-width="2"/>
    <line x1="25" y1="25" x2="25" y2="12" stroke="url(#maintainGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="25" x2="35" y2="30" stroke="url(#maintainGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- 文字 -->
  <text x="200" y="230" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#475569" text-anchor="middle">系统维护中</text>
  <text x="200" y="255" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">请稍后再试</text>
</svg>
