<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="onboardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4"/>
      <stop offset="100%" style="stop-color:#34A853"/>
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#EA4335"/>
      <stop offset="100%" style="stop-color:#FF6B6B"/>
    </linearGradient>
  </defs>
  
  <!-- 背景装饰 -->
  <circle cx="200" cy="130" r="90" fill="url(#onboardGrad)" opacity="0.06"/>
  
  <!-- 云朵 -->
  <g opacity="0.3">
    <ellipse cx="100" cy="180" rx="30" ry="15" fill="#4285F4"/>
    <ellipse cx="120" cy="175" rx="20" ry="12" fill="#4285F4"/>
    <ellipse cx="85" cy="178" rx="18" ry="10" fill="#4285F4"/>
  </g>
  
  <!-- 火箭 -->
  <g transform="translate(175, 60)">
    <!-- 火焰 -->
    <path d="M25 80 Q20 100 25 110 Q30 100 25 80" fill="url(#rocketGrad)" opacity="0.8">
      <animate attributeName="d" values="M25 80 Q20 100 25 110 Q30 100 25 80;M25 80 Q18 95 25 108 Q32 95 25 80;M25 80 Q20 100 25 110 Q30 100 25 80" dur="0.5s" repeatCount="indefinite"/>
    </path>
    
    <!-- 火箭身 -->
    <path d="M25 10 Q35 30 35 70 L15 70 Q15 30 25 10" fill="url(#onboardGrad)"/>
    
    <!-- 窗户 -->
    <circle cx="25" cy="45" r="8" fill="white" opacity="0.9"/>
    
    <!-- 翅膀 -->
    <path d="M15 55 L5 70 L15 65" fill="url(#onboardGrad)" opacity="0.8"/>
    <path d="M35 55 L45 70 L35 65" fill="url(#onboardGrad)" opacity="0.8"/>
  </g>
  
  <!-- 星星 -->
  <circle cx="120" cy="80" r="3" fill="#FBBC05" opacity="0.8"/>
  <circle cx="280" cy="90" r="2" fill="#FBBC05" opacity="0.6"/>
  <circle cx="150" cy="130" r="2" fill="#4285F4" opacity="0.7"/>
  <circle cx="260" cy="150" r="3" fill="#34A853" opacity="0.6"/>
  <circle cx="300" cy="120" r="2" fill="#EA4335" opacity="0.5"/>
  
  <!-- 文字 -->
  <text x="200" y="240" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#475569" text-anchor="middle">欢迎使用 SoloForge</text>
  <text x="200" y="265" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">开启你的智能工作之旅</text>
</svg>
