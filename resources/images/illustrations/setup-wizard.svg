<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="setupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4"/>
      <stop offset="50%" style="stop-color:#34A853"/>
      <stop offset="100%" style="stop-color:#FBBC05"/>
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <!-- 背景装饰 -->
  <circle cx="200" cy="130" r="100" fill="url(#setupGrad)" opacity="0.05"/>
  
  <!-- 齿轮 -->
  <g transform="translate(150, 60)">
    <!-- 外齿轮 -->
    <circle cx="50" cy="50" r="45" fill="url(#gearGrad)"/>
    <!-- 齿 -->
    <g fill="url(#gearGrad)">
      <rect x="42" y="0" width="16" height="15" rx="2"/>
      <rect x="42" y="85" width="16" height="15" rx="2"/>
      <rect x="0" y="42" width="15" height="16" rx="2"/>
      <rect x="85" y="42" width="15" height="16" rx="2"/>
      <rect x="12" y="12" width="15" height="16" rx="2" transform="rotate(45 19 20)"/>
      <rect x="73" y="12" width="15" height="16" rx="2" transform="rotate(-45 80 20)"/>
      <rect x="12" y="72" width="15" height="16" rx="2" transform="rotate(-45 19 80)"/>
      <rect x="73" y="72" width="15" height="16" rx="2" transform="rotate(45 80 80)"/>
    </g>
    <!-- 内圆 -->
    <circle cx="50" cy="50" r="28" fill="white"/>
    <circle cx="50" cy="50" r="22" fill="url(#gearGrad)"/>
  </g>
  
  <!-- 扳手 -->
  <g transform="translate(220, 100)">
    <path d="M0 50 L25 25 L35 35 L10 60 L20 70 L5 55 Z" fill="url(#setupGrad)" opacity="0.8"/>
    <circle cx="55" cy="40" r="20" fill="none" stroke="url(#setupGrad)" stroke-width="8"/>
    <path d="M70 25 L90 5" stroke="url(#setupGrad)" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- 装饰线 -->
  <path d="M100 200 Q150 180 200 200 Q250 220 300 200" fill="none" stroke="url(#setupGrad)" stroke-width="2" opacity="0.3"/>
  
  <!-- 文字 -->
  <text x="200" y="250" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#475569" text-anchor="middle">开始设置</text>
  <text x="200" y="275" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">配置你的工作区</text>
</svg>
