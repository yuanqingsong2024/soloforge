<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="emptyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4"/>
      <stop offset="100%" style="stop-color:#34A853"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  
  <!-- 背景装饰 -->
  <circle cx="200" cy="130" r="80" fill="url(#emptyGrad)" opacity="0.08"/>
  <circle cx="200" cy="130" r="50" fill="url(#emptyGrad)" opacity="0.05"/>
  
  <!-- 打开的箱子 -->
  <g transform="translate(140, 100)">
    <!-- 箱体 -->
    <rect x="20" y="60" width="100" height="70" rx="8" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- 箱盖（打开状态） -->
    <path d="M20 60 L20 30 Q20 20 30 20 L110 20 Q120 20 120 30 L120 60" 
          fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- 箱子内部（空白） -->
    <rect x="30" y="70" width="80" height="50" rx="4" fill="white"/>
    
    <!-- 虚线框表示空白区域 -->
    <rect x="40" y="80" width="60" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    
    <!-- 装饰性星星 -->
    <circle cx="50" cy="55" r="3" fill="#4285F4" opacity="0.6"/>
    <circle cx="90" cy="50" r="2" fill="#34A853" opacity="0.6"/>
    <circle cx="70" cy="45" r="2.5" fill="#FBBC05" opacity="0.6"/>
  </g>
  
  <!-- 文字 -->
  <text x="200" y="250" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#475569" text-anchor="middle">暂无数据</text>
  <text x="200" y="275" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">开始创建你的第一个内容吧</text>
</svg>
