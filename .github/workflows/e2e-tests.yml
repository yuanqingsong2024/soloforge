name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    timeout-minutes: 30
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - dashboard
          - workflow
          - operations
          - reliability
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      
      - name: Setup Database
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed
        env:
          DATABASE_URL: file:./e2e-test.db

      - name: Build application for E2E
        run: npm run build

      - name: Run E2E tests
        shell: pwsh
        run: |
          switch ('${{ matrix.suite }}') {
            'dashboard' { npx playwright test tests/e2e/app-launch.spec.ts tests/e2e/dashboard-*.spec.ts tests/e2e/workspace-switch.spec.ts tests/e2e/theme-toggle.spec.ts tests/e2e/dashboard-empty-state.spec.ts }
            'workflow' { npx playwright test tests/e2e/approval-flow.spec.ts tests/e2e/ticket-board.spec.ts tests/e2e/team-management.spec.ts tests/e2e/team-hiring.spec.ts tests/e2e/contact-binding.spec.ts tests/e2e/template-rendering.spec.ts }
            'operations' { npx playwright test tests/e2e/config-center.spec.ts tests/e2e/deployments.spec.ts tests/e2e/doctor-page.spec.ts tests/e2e/openclaw-bootstrap.spec.ts tests/e2e/legacy-module-smoke.spec.ts tests/e2e/change-and-backup-flows.spec.ts }
            'reliability' { npx playwright test tests/e2e/retry-mechanism.spec.ts tests/e2e/idempotency.spec.ts }
          }
        env:
          CI: true
          DATABASE_URL: file:./e2e-test.db

      - name: Clean test database
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue e2e-test.db, e2e-test.db-wal, e2e-test.db-shm
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.suite }}
          path: test-results/
          retention-days: 30
      
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report-${{ matrix.suite }}
          path: test-results/html/
          retention-days: 30
