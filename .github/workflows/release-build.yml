name: Release Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium ffmpeg
      - run: npm run test:unit
      - run: npm run test:renderer -- --no-file-parallelism --maxWorkers=1
      - run: npm run test:integration
      - run: npm run build
      - run: npm run test:e2e

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run release:check
      - name: Generate and verify SHA256 checksums
        shell: bash
        run: |
          npm run release:generate-checksums
          npm run release:verify-checksums
      - name: Validate version and platform artifact
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npm run release:validate -- ${{ matrix.platform }}
      - name: Verify packaged runtime
        if: matrix.platform == 'linux'
        run: npm run release:verify-runtime
      - name: Verify signing status on Windows
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'win'
        shell: pwsh
        run: |
          $artifact = Get-ChildItem -Path release -Recurse -Filter *.exe | Select-Object -First 1
          $status = Get-AuthenticodeSignature -FilePath $artifact.FullName
          if ($status.Status -ne 'Valid') { throw "Windows 制品签名状态不是 Valid: $($status.Status)" }
      - name: Verify signing status on macOS
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'mac'
        shell: bash
        run: |
          artifact=$(find release -type f -name '*.dmg' -print -quit)
          codesign --verify --deep --strict "$artifact"
      - name: Report signing status on Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: echo "Linux AppImage 不伪造代码签名；完整性由 SHA256 校验保证"
      - name: Report unsigned internal build
        if: startsWith(github.ref, 'refs/tags/v') == false
        shell: bash
        run: echo "非标签构建：仅作为内部 RC，未宣称正式签名发行版"
      - uses: actions/upload-artifact@v4
        with:
          name: soloforge-${{ matrix.platform }}
          path: release/
