name: Release Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run release:check
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          find release -type f -print0 | xargs -0 sha256sum > release/SHA256SUMS.txt
      - name: Verify platform artifact
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            linux) test -f release/*/*.AppImage || test -f release/*.AppImage ;;
            win) test -f release/*/*.exe || test -f release/*.exe ;;
            mac) test -f release/*/*.dmg || test -f release/*.dmg ;;
          esac
      - name: Require signing credentials for release tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            test -n "${WIN_CSC_LINK:-}" || { echo "Windows 签名凭证未配置，禁止标签发布"; exit 1; }
          else
            test -n "${CSC_LINK:-}" || { echo "${{ matrix.platform }} 签名凭证未配置，禁止标签发布"; exit 1; }
          fi
      - name: Report unsigned internal build
        if: startsWith(github.ref, 'refs/tags/v') == false
        shell: bash
        run: echo "非标签构建：仅作为内部 RC，未宣称正式签名发行版"
      - uses: actions/upload-artifact@v4
        with:
          name: soloforge-${{ matrix.platform }}
          path: release/
